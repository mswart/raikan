[package]
name = "raikan"
version = "0.3.0"
edition = "2024"
description = "Hanabi bot using Hyphenated rules for hanab.io"
readme = "README.md"
repository = "https://github.com/mswart/raikan"
license = "AGPL-3.0-or-later"
keywords = ["hanabi", "hyphenated", "bot"]
categories = ["games", "simulation"]
include = ["/src", "/tests", "/benches", "LICENSE"]
# be explicit about MSRV, but use first version with edition 2024 for now:
rust-version = "1.85"

[dependencies]
colored = "3.0.0"
rand = "0.8.5"
rand_pcg = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.23", features = [
    "blocking",
    "json",
    "rustls-tls",
], optional = true, default-features = false }
slog = "2.7.0"
smallvec = { version = "1.15.1", features = ["const_generics"] }
tungstenite = { version = "0.28.0", optional = true, features = [
    "rustls-tls-webpki-roots",
] }

[[bin]]
name = "raikan-web"
bench = false
required-features = ["webclient"]

[[bench]]
name = "simulation"
harness = false

[profile.release]
debug = true
lto = "thin"
codegen-units = 1

[features]
webclient = ["dep:tungstenite", "dep:reqwest"]

[dev-dependencies]
slog-term = "2.9.2"
